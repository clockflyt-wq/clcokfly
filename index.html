
<div id="shop" dir="rtl">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: auto;
      min-height: 0;
      overflow-x: hidden;
    }

    #shop {
      font-family: Arial, sans-serif;
      color: #243044;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 8px;
      box-sizing: border-box;
      text-align: center;
      container-type: inline-size;
      font-size: clamp(12px, 1.5cqw, 16px);
    }

    #shop *,
    #shop *::before,
    #shop *::after {
      box-sizing: border-box;
    }

    #shop .products {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 155px), 1fr)
      );
      gap: clamp(6px, 1.5cqw, 16px);
      width: 100%;
    }

    #shop .product,
    #shop .cart {
      border: 1px solid #e2e7ed;
      border-radius: clamp(8px, 1.5cqw, 16px);
      padding: clamp(7px, 1.5cqw, 16px);
      background: #fff;
      min-width: 0;
      text-align: center;
    }

    #shop .product img {
      display: block;
      width: 100%;
      height: clamp(85px, 18cqw, 200px);
      object-fit: contain;
      border-radius: 8px;
      margin: 0 auto;
    }

    #shop h2 {
      font-size: clamp(17px, 2.4cqw, 25px);
      line-height: 1.4;
      margin: 12px 0 16px;
      text-align: center;
    }

    #shop h3 {
      font-size: clamp(12px, 1.8cqw, 18px);
      line-height: 1.5;
      margin: 8px 0;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #shop .price {
      color: #16734b;
      font-weight: bold;
      font-size: clamp(12px, 1.7cqw, 17px);
      line-height: 1.5;
      text-align: center;
    }

    #shop button {
      border: 0;
      border-radius: 8px;
      padding: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: clamp(11px, 1.5cqw, 15px);
      min-height: 36px;
      line-height: 1.4;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #shop .add,
    #shop .checkout {
      background: #176b4d;
      color: white;
      width: 100%;
      margin-top: 10px;
    }

    #shop .add.added {
      background: #e7f4ec;
      color: #176b4d;
      border: 1px solid #b9dfc7;
      cursor: default;
    }

    #shop .cart {
      margin-top: 20px;
    }

    #shop .cart-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    #shop .cart-row > div {
      min-width: 0;
      overflow-wrap: anywhere;
      text-align: center;
    }

    #shop .qty {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    #shop .qty button,
    #shop .remove {
      background: #edf1f5;
      color: #243044;
      min-width: 36px;
    }

    #shop .total {
      font-size: clamp(16px, 2cqw, 21px);
      font-weight: bold;
      margin-top: 18px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    #shop .empty {
      color: #687386;
      text-align: center;
    }

    #shop #whatsappLink {
      display: block;
      padding: 12px;
      background: #176b4d;
      color: white;
      text-align: center;
      border-radius: 8px;
      margin-top: 12px;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    #shop p {
      text-align: center;
      line-height: 1.6;
    }

    /* عرض الموبايل والإطارات الضيقة */
    @container (max-width: 420px) {
      #shop .products {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #shop .product img {
        height: clamp(75px, 22cqw, 115px);
      }

      #shop .product {
        padding: 7px;
      }

      #shop .cart-row {
        justify-content: center;
      }
    }

    /* الإطار شديد الضيق */
    @container (max-width: 230px) {
      #shop .products {
        grid-template-columns: 1fr;
      }

      #shop .product img {
        height: 120px;
      }
    }
  </style>

  <div class="products" id="products"></div>

  <div class="cart">
    <h2>🛒 سلة المشتريات</h2>
    <div id="cartItems" class="empty">السلة فارغة حاليًا.</div>
    <div id="total" class="total">الإجمالي: 0 جنيه</div>

    <button class="checkout" id="checkout">
      اطلب عبر واتساب
    </button>

    <p style="font-size:12px;color:#687386">
      سيتم فتح واتساب برسالة جاهزة لمراجعتها وإرسالها.
    </p>
  </div>
</div>

<script>
(() => {
  const WHATSAPP_NUMBER = "201031944517";

  const products = [
    {
      id: 1,
      name: "كتاب الحروف القبطية",
      price: 300,
      image: "https://placehold.co/400x300/edf3ed/243044?text=Coptic+Book"
    },
    {
      id: 2,
      name: "كتاب تعليمي تفاعلي",
      price: 450,
      image: "https://placehold.co/400x300/f5eee2/243044?text=Learning+Book"
    },
    {
      id: 3,
      name: "مجموعة البطاقات التعليمية",
      price: 180,
      image: "https://placehold.co/400x300/e8eef8/243044?text=Flash+Cards"
    }
  ];

  const cart = {};
  const money = n => n.toLocaleString("en-US") + " جنيه";

  const productsEl = document.getElementById("products");
  const cartEl = document.getElementById("cartItems");
  const totalEl = document.getElementById("total");
  const shopEl = document.getElementById("shop");

  productsEl.innerHTML = products.map(p => `
    <div class="product">
      <img src="${p.image}" alt="${p.name}" loading="lazy">
      <h3>${p.name}</h3>
      <div class="price">${money(p.price)}</div>
      <button class="add" data-add="${p.id}" aria-pressed="false">
        أضف إلى السلة
      </button>
    </div>
  `).join("");

  function updateProductButtons() {
    productsEl.querySelectorAll("[data-add]").forEach(btn => {
      const added = (cart[btn.dataset.add] || 0) > 0;
      btn.textContent = added ? "تم إضافتها ✓" : "أضف إلى السلة";
      btn.classList.toggle("added", added);
      btn.setAttribute("aria-pressed", String(added));
    });
  }

  function renderCart() {
    const ids = Object.keys(cart).filter(id => cart[id] > 0);

    if (!ids.length) {
      cartEl.className = "empty";
      cartEl.textContent = "السلة فارغة حاليًا.";
      totalEl.textContent = "الإجمالي: 0 جنيه";
    } else {
      cartEl.className = "";

      cartEl.innerHTML = ids.map(id => {
        const p = products.find(x => x.id === Number(id));
        const qty = cart[id];

        return `
          <div class="cart-row">
            <div>
              <strong>${p.name}</strong><br>
              <small>${money(p.price)} × ${qty}</small>
            </div>
            <div class="qty">
              <button data-change="${id}" data-delta="1"
                aria-label="زيادة الكمية">+</button>
              <span>${qty}</span>
              <button data-change="${id}" data-delta="-1"
                aria-label="تقليل الكمية">−</button>
              <button class="remove" data-remove="${id}"
                aria-label="حذف المنتج">×</button>
            </div>
          </div>
        `;
      }).join("");

      const total = ids.reduce((sum, id) => {
        const p = products.find(x => x.id === Number(id));
        return sum + p.price * cart[id];
      }, 0);

      totalEl.textContent = "الإجمالي: " + money(total);
    }

    updateProductButtons();
    scheduleHeightUpdate();
  }

  productsEl.addEventListener("click", e => {
    const btn = e.target.closest("[data-add]");
    if (!btn) return;

    const id = btn.dataset.add;
    if ((cart[id] || 0) > 0) return;

    cart[id] = 1;
    renderCart();
  });

  cartEl.addEventListener("click", e => {
    const change = e.target.closest("[data-change]");
    const remove = e.target.closest("[data-remove]");

    if (change) {
      const id = change.dataset.change;
      cart[id] = (cart[id] || 0) + Number(change.dataset.delta);
      if (cart[id] <= 0) delete cart[id];
      renderCart();
    }

    if (remove) {
      delete cart[remove.dataset.remove];
      renderCart();
    }
  });

  document.getElementById("checkout").addEventListener("click", () => {
    const ids = Object.keys(cart).filter(id => cart[id] > 0);

    if (!ids.length) {
      alert("من فضلك أضف منتجًا إلى السلة أولًا.");
      return;
    }

    const total = ids.reduce((sum, id) => {
      const p = products.find(x => x.id === Number(id));
      return sum + p.price * cart[id];
    }, 0);

    const lines = ids.map((id, i) => {
      const p = products.find(x => x.id === Number(id));
      return `${i + 1}. ${p.name}\nالكمية: ${cart[id]}\nالسعر: ${money(p.price * cart[id])}`;
    });

    const message =
      "مرحبًا، أريد طلب المنتجات التالية:\n\n" +
      lines.join("\n\n") +
      "\n\nالإجمالي: " + money(total) +
      "\n\nبرجاء التواصل معي لاستكمال الطلب.";

    const url = "https://wa.me/" + WHATSAPP_NUMBER +
      "?text=" + encodeURIComponent(message);

    let link = document.getElementById("whatsappLink");

    if (!link) {
      link = document.createElement("a");
      link.id = "whatsappLink";
      link.target = "_blank";
      link.rel = "noopener";
      shopEl.querySelector(".cart").appendChild(link);
    }

    link.href = url;
    link.textContent = "اضغط هنا لفتح واتساب وإرسال الطلب";
    scheduleHeightUpdate();

    window.open(url, "_blank", "noopener");
  });

  let lastHeight = 0;
  let heightScheduled = false;

  function updateHeight() {
    heightScheduled = false;

    const height = Math.ceil(
      shopEl.getBoundingClientRect().height
    );

    if (height === lastHeight) return;
    lastHeight = height;

    window.parent.postMessage({
      type: "shop-height",
      height: height
    }, "*");
  }

  function scheduleHeightUpdate() {
    if (heightScheduled) return;

    heightScheduled = true;

    requestAnimationFrame(() => {
      updateHeight();
    });
  }

  if ("ResizeObserver" in window) {
    const observer = new ResizeObserver(scheduleHeightUpdate);
    observer.observe(shopEl);
  }

  shopEl.querySelectorAll("img").forEach(img => {
    img.addEventListener("load", scheduleHeightUpdate);
    img.addEventListener("error", scheduleHeightUpdate);
  });

  window.addEventListener("load", scheduleHeightUpdate);
  window.addEventListener("resize", scheduleHeightUpdate);

  renderCart();
  scheduleHeightUpdate();
})();
</script>
